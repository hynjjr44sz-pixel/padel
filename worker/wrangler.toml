name = "padel-push"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

# deploy.sh fills in the id (creates the namespace "padel-push" if missing)
[[kv_namespaces]]
binding = "PUSH"
id = "eedc18b48ae24d419ec6826a87069430"

[triggers]
crons = ["* * * * *"]

[vars]
ORIGIN = "https://padel.holmberg.st"
VAPID_SUBJECT = "https://padel.holmberg.st"

# Secrets (set by deploy.sh with `wrangler secret put`): VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY

# Per-IP rate limits (free plan): subscribe/unsubscribe, and the public GET routes (each costs KV reads).
[[ratelimits]]
name = "SUB_RL"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "API_RL"
namespace_id = "1002"
simple = { limit = 60, period = 60 }

name = "padel-push"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

# deploy.sh fills in the id (creates the namespace "padel-push" if missing)
[[kv_namespaces]]
binding = "PUSH"
id = "eedc18b48ae24d419ec6826a87069430"

[triggers]
crons = ["* * * * *"]

[vars]
ORIGIN = "https://padel.holmberg.st"
VAPID_SUBJECT = "https://padel.holmberg.st"

# Secrets (set by deploy.sh with `wrangler secret put`): VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY

<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nynäs Padel</title>
<meta name="description" content="Nynäs Padel Club: spelarna, lagen, matcherna och resultaten.">

<meta name="theme-color" content="#EDF0F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#040A1B" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nynäs Padel">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Instrument+Sans:wght@400;500;600;700&family=Chivo+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EDF0F5;
    --surface:#FFFFFF;
    --surface-2:#E3E8F1;
    --ink:#0A1733;
    --dim:#4F5A74;
    --faint:#66708A;
    --line:#D5DBE7;
    --accent:#1F4FCF;          /* court blue: links, path, active on light */
    --accent-soft:#E3EBFD;
    --racket:#8EC5FF;          /* Bullpadel light blue */
    --ball:#FFD84A;            /* small yellow accent, on navy only */
    --loss:#B04A40;
    --loss-soft:#F4E4E1;
    --navy:#0A1733;
    --board:#060D22;
    --board-2:#0E1C40;
    --board-line:rgba(255,255,255,.14);
    --board-ink:#F3F6FC;
    --board-dim:#A6B2D2;
    --shadow:0 18px 40px -26px rgba(6,13,34,.55);
    --solid:#0A1733; --solid-ink:#FFFFFF; --panel:#0A1733;
    --up:#17774A;              /* trend: better */
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#040A1B;
      --surface:#0B1733;
      --surface-2:#13224B;
      --ink:#F2F5FB;
      --dim:#A7B3D0;
      --faint:#8795BA;
      --line:#1E2D58;
      --accent:#8EC5FF;
      --accent-soft:#132B55;
      --loss:#E79A90;
      --loss-soft:#35202A;
      --board:#020716;
      --board-2:#0B1633;
      --shadow:0 18px 40px -26px rgba(0,0,0,.8);
      --solid:#8EC5FF; --solid-ink:#0A1733; --panel:#16295A;
      --up:#6FD69C;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#040A1B;
    --surface:#0B1733;
    --surface-2:#13224B;
    --ink:#F2F5FB;
    --dim:#A7B3D0;
    --faint:#8795BA;
    --line:#1E2D58;
    --accent:#8EC5FF;
    --accent-soft:#132B55;
    --loss:#E79A90;
    --loss-soft:#35202A;
    --board:#020716;
    --board-2:#0B1633;
    --shadow:0 18px 40px -26px rgba(0,0,0,.8);
    --solid:#8EC5FF; --solid-ink:#0A1733; --panel:#16295A;
    --up:#6FD69C;
    color-scheme:dark;
  }

  *{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; background:var(--bg); }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.45 "Instrument Sans", -apple-system, system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:0 16px max(32px, env(safe-area-inset-bottom));
    overflow-x:hidden; overflow-x:clip;
  }
  .page{ max-width:640px; margin:0 auto; }
  .mono{ font-family:"Chivo Mono", ui-monospace, monospace; font-variant-numeric:tabular-nums; }
  a{ color:var(--accent); text-underline-offset:3px; }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:3px; border-radius:6px; }
  img{ display:block; }

  /* ---------- sticky top + tabs ---------- */
  .top{
    position:sticky; top:0; z-index:20; margin:0 -16px; padding:max(10px, env(safe-area-inset-top)) 16px 10px;
    background:var(--bg);
  }
  @supports ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
    .top{ background:color-mix(in srgb, var(--bg) 80%, transparent); -webkit-backdrop-filter:saturate(1.4) blur(16px); backdrop-filter:saturate(1.4) blur(16px); }
  }
  .top-in{ max-width:640px; margin:0 auto; }
  .brandrow{ display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:8px; min-height:28px; }
  .tools{ display:flex; align-items:center; gap:10px; flex:none; }
  .brand{ font:800 15px/1 "Big Shoulders Display", sans-serif; letter-spacing:.16em; text-transform:uppercase; }
  .today{ white-space:nowrap; font:500 11px/1 "Chivo Mono", monospace; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); }

  /* ---------- app: notiser + installera ---------- */
  .bell{
    appearance:none; display:inline-flex; align-items:center; gap:6px; height:28px; padding:0 11px 0 9px; flex:none;
    border-radius:99px; border:1px solid var(--line); background:var(--surface); color:var(--dim); cursor:pointer;
    font:600 10.5px/1 "Chivo Mono", monospace; letter-spacing:.08em; text-transform:uppercase;
  }
  .bell svg{ width:15px; height:15px; flex:none; }
  .bell:hover{ border-color:var(--ink); color:var(--ink); }
  .bell[aria-pressed="true"]{ background:var(--solid); border-color:var(--solid); color:var(--solid-ink); }
  .bell[aria-pressed="true"] .bd{ display:block; }
  .bell .bd{ display:none; }
  .brand{ min-width:0; }
  .brand{ display:flex; align-items:center; gap:8px; }
  .brand img{ height:24px; width:auto; flex:none; }
  .brand span{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  @media (max-width:379px){ .bell{ width:30px; padding:0; justify-content:center; } .bell span{ display:none; } }
  .nhint{
    margin:8px 0 0; padding:9px 12px; border-radius:12px; background:var(--surface); border:1px solid var(--line);
    font-size:13px; line-height:1.4; color:var(--ink); cursor:pointer; box-shadow:var(--shadow);
  }
  .nhint[hidden], .appbar[hidden]{ display:none; }
  .appbar{
    display:flex; align-items:center; gap:12px; margin:6px 0 10px; padding:9px 8px 9px 10px;
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
  }
  .appbar img{ width:36px; height:36px; border-radius:9px; flex:none; }
  .appbar .t{ flex:1; min-width:0; font-size:12.5px; line-height:1.3; color:var(--dim); }
  .appbar .t b{ display:block; color:var(--ink); font-size:14px; font-weight:700; }
  .appbar .go{
    appearance:none; border:0; cursor:pointer; flex:none; padding:8px 12px; border-radius:10px;
    background:var(--solid); color:var(--solid-ink); font:700 13px/1 "Instrument Sans", sans-serif;
  }
  .appbar .go[hidden]{ display:none; }
  .appbar .x{
    appearance:none; border:0; background:transparent; color:var(--faint); cursor:pointer; flex:none;
    width:30px; height:30px; border-radius:8px; font:500 20px/1 system-ui, sans-serif;
  }
  .appbar .x:hover{ background:var(--surface-2); color:var(--ink); }

  /* ---------- photo hero ---------- */
  .hero{
    position:relative; margin:4px -16px 0; overflow:hidden; background:var(--board); color:var(--board-ink);
    width:auto; height:clamp(400px, 112vw, 460px);
  }
  .hero > img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:50% 0%; }
  .hero .scrim{
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(6,13,34,.30) 0%, rgba(6,13,34,0) 18%, rgba(6,13,34,0) 40%, rgba(6,13,34,.72) 64%, var(--board) 96%);
  }
  .hero .court{ position:absolute; left:0; right:0; bottom:0; width:100%; height:30%; opacity:.12; }
  .hero-top{ position:absolute; top:12px; left:16px; right:16px; display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .glass{
    display:inline-flex; align-items:center; gap:7px; white-space:nowrap;
    font:600 11px/1 "Chivo Mono", monospace; letter-spacing:.08em; text-transform:uppercase;
    padding:7px 10px; border-radius:99px; color:#fff; text-decoration:none;
    background:rgba(6,13,34,.42); border:1px solid rgba(255,255,255,.18);
    -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
  }
  .glass .dot{ width:7px; height:7px; border-radius:50%; background:var(--racket); flex:none; }
  .glass.live{ background:var(--ball); color:var(--board); border-color:var(--ball); }
  .glass.live .dot{ background:var(--board); }
  .glass.done .dot{ background:var(--board-dim); }
  .hero-top > .glass{ flex:none; }
  .hero-top > a.glass{ display:block; flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; }
  .hero-bot{ position:absolute; left:16px; right:16px; bottom:14px; }
  .eyebrow{ font:600 11px/1.2 "Chivo Mono", monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--board-dim); }
  .hero-bot .eyebrow{ color:var(--racket); }
  .timeline-big{ display:flex; align-items:flex-end; gap:14px; margin-top:6px; }
  .bigtime{
    font:900 clamp(96px, 31vw, 136px)/.78 "Big Shoulders Display", sans-serif; letter-spacing:-.01em;
    font-variant-numeric:tabular-nums; color:#fff;
  }
  .court-no{ padding-bottom:4px; }
  .court-no small{ display:block; font:600 11px/1 "Chivo Mono", monospace; letter-spacing:.14em; color:var(--board-dim); }
  .court-no b{ display:block; font:900 54px/.8 "Big Shoulders Display", sans-serif; color:var(--racket); margin-top:6px; }

  .board{
    position:relative; margin:0 -16px; padding:4px 16px 16px; background:var(--board); color:var(--board-ink);
  }
  .countdown{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:11px 0; border-top:1px solid var(--board-line); border-bottom:1px solid var(--board-line);
    font:500 12.5px/1.3 "Chivo Mono", monospace; color:var(--board-ink);
  }
  .countdown .l{ display:flex; align-items:center; gap:9px; min-width:0; }
  .countdown .dot{ width:8px; height:8px; border-radius:50%; background:var(--racket); flex:none; }
  .countdown.live .dot{ background:var(--ball); }
  .countdown a{ color:var(--board-dim); font-size:11.5px; white-space:nowrap; text-decoration:none; }
  .countdown a:hover{ color:#fff; }

  .vs{ display:grid; gap:0; }
  .team{ display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:center; padding:13px 0; }
  .team + .team{ border-top:1px dashed var(--board-line); }
  .tname{ font:800 21px/1.02 "Big Shoulders Display", sans-serif; text-transform:uppercase; letter-spacing:.02em; min-width:0; overflow-wrap:anywhere; }
  .tname small{ display:block; font:500 12px/1.35 "Instrument Sans", sans-serif; text-transform:none; letter-spacing:0; color:var(--board-dim); margin-top:3px; }
  .team.opp .tname{ font-size:13px; font-family:"Chivo Mono", monospace; font-weight:500; letter-spacing:.08em; color:var(--board-dim); }
  .opts{ display:grid; gap:8px; margin-top:8px; }
  .opt{ display:flex; align-items:center; gap:10px; font:700 14.5px/1.2 "Instrument Sans", sans-serif; text-transform:none; letter-spacing:0; color:var(--board-ink); }
  .opt i{ font-style:normal; font:500 11px/1 "Chivo Mono", monospace; color:var(--board-dim); letter-spacing:.06em; }
  .seed{ font:600 11px/1 "Chivo Mono", monospace; padding:5px 7px; border-radius:6px; background:rgba(255,255,255,.1); color:var(--board-ink); white-space:nowrap; }
  .team.me .seed{ background:var(--racket); color:var(--navy); }
  .tag{ font:600 10.5px/1.2 "Chivo Mono", monospace; letter-spacing:.06em; text-transform:uppercase; color:var(--board-dim); text-align:right; }

  /* avatars */
  .avs{ display:flex; flex:none; }
  .av{
    width:var(--s, 36px); height:var(--s, 36px); border-radius:50%; flex:none; overflow:hidden; position:relative;
    background:#13245A; color:var(--racket); box-shadow:0 0 0 2px var(--ring, var(--board));
    display:flex; align-items:center; justify-content:center;
    font:800 calc(var(--s, 36px) * .42)/1 "Big Shoulders Display", sans-serif; letter-spacing:.04em;
  }
  .av img{ width:100%; height:100%; object-fit:cover; }
  .avs .av + .av{ margin-left:calc(var(--s, 36px) * -.28); }
  .avs.sm{ --s:24px; }
  .avs .av.ini:first-child:not(:last-child){ padding-right:calc(var(--s, 36px) * .26); }
  .avs.md{ --s:30px; }

  /* ---------- route ---------- */
  .route{ list-style:none; margin:14px 0 0; padding:4px 16px; background:var(--surface); border:1px solid var(--line); border-radius:16px; }
  .route li{ display:grid; grid-template-columns:22px 1fr auto; gap:12px; align-items:center; padding:11px 0; position:relative; }
  .route li + li{ border-top:1px solid var(--line); }
  .node{ width:14px; height:14px; border-radius:50%; border:2px solid var(--line); background:var(--surface); justify-self:center; position:relative; z-index:1; }
  .route li::before{ content:""; position:absolute; left:10px; top:0; bottom:0; width:2px; background:var(--line); }
  .route li:first-child::before{ top:50%; }
  .route li:last-child::before{ bottom:50%; }
  .route li.done .node{ background:var(--accent); border-color:var(--accent); }
  .route li.done::before{ background:var(--accent); }
  .route li.next .node{ border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-soft); }
  .route .rn{ font:800 19px/1 "Big Shoulders Display", sans-serif; text-transform:uppercase; letter-spacing:.04em; }
  .route .rm{ font:500 11.5px/1.3 "Chivo Mono", monospace; color:var(--dim); margin-top:3px; }
  .route .rs{ font:600 11px/1.2 "Chivo Mono", monospace; letter-spacing:.06em; text-transform:uppercase; color:var(--faint); text-align:right; }
  .route li.next .rs{ color:var(--accent); }
  .tiles{ display:grid; grid-template-rows:auto auto; grid-auto-flow:column; gap:2px; }
  .tiles span{ width:22px; height:22px; display:flex; align-items:center; justify-content:center; border-radius:5px; font:900 15px/1 "Big Shoulders Display", sans-serif; font-variant-numeric:tabular-nums; background:var(--surface-2); color:var(--faint); }
  .tiles span.w{ background:var(--solid); color:var(--solid-ink); }

  /* ---------- sections ---------- */
  section{ margin-top:36px; scroll-margin-top:120px; }
  .sh{ display:flex; align-items:flex-end; justify-content:space-between; gap:10px; margin-bottom:12px; border-bottom:2px solid var(--ink); padding-bottom:6px; }
  .sh h2{ margin:0; font:900 30px/.9 "Big Shoulders Display", sans-serif; text-transform:uppercase; letter-spacing:.01em; }
  .sh .meta{ font:500 11px/1.3 "Chivo Mono", monospace; color:var(--dim); text-align:right; letter-spacing:.04em; }
  .card{ background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px 16px; }
  .sub{ font-size:13px; color:var(--dim); margin:10px 0 0; }

  /* segmented */
  .seg{ display:inline-grid; grid-auto-flow:column; gap:2px; padding:3px; background:var(--surface-2); border-radius:11px; margin-bottom:12px; max-width:100%; }
  .seg button{ appearance:none; border:0; background:transparent; color:var(--dim); cursor:pointer; padding:7px 12px; border-radius:8px; font:600 13px/1.1 "Instrument Sans", sans-serif; white-space:nowrap; }
  .seg button[aria-pressed="true"]{ background:var(--surface); color:var(--ink); box-shadow:0 1px 3px rgba(6,13,34,.14); }

  .bk-nav{ display:none; gap:6px; }
  .bk-nav button{ width:34px; height:30px; border-radius:9px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font:600 15px/1 system-ui, sans-serif; cursor:pointer; }
  .bk-nav button:hover:not(:disabled){ border-color:var(--ink); }
  .bk-nav button:disabled{ opacity:.35; cursor:default; }
  @media (hover:hover) and (pointer:fine){ .bk-nav{ display:inline-flex; } .bk-note .swipe{ display:none; } }
  .e .n .sk{ display:block; font:500 10px/1.3 "Chivo Mono", monospace; color:var(--dim); letter-spacing:0; margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .opt .osk{ display:block; font:500 10.5px/1.3 "Chivo Mono", monospace; color:var(--board-dim); margin-top:2px; }
  /* ---------- bracket ---------- */
  .bk-wrap{ position:relative; margin:0 -16px; }
  .bk-wrap::after{
    content:""; position:absolute; top:0; right:0; bottom:10px; width:32px; pointer-events:none;
    background:linear-gradient(90deg, transparent, var(--bg)); opacity:0; transition:opacity .2s;
  }
  .bk-wrap.more::after{ opacity:1; }
  .bk-scroll{
    overflow-x:auto; overscroll-behavior-x:contain; scroll-snap-type:x mandatory; scroll-padding-inline:16px;
    padding:0 16px 10px; -webkit-overflow-scrolling:touch; scrollbar-width:none;
  }
  .bk-scroll::-webkit-scrollbar{ display:none; }
  .bk{ display:flex; width:max-content; --cw:238px; --gap:24px; --slot:170px; }
  .bk-col{ width:calc(var(--cw) + var(--gap)); flex:none; scroll-snap-align:start; }
  .bk-col:last-child{ width:var(--cw); }
  .bk-hd{ height:46px; }
  .bk-hd b{ display:block; font:800 19px/1 "Big Shoulders Display", sans-serif; text-transform:uppercase; letter-spacing:.05em; }
  .bk-hd span{ display:block; font:500 11px/1.2 "Chivo Mono", monospace; color:var(--dim); margin-top:4px; }
  .bk-body{ display:flex; flex-direction:column; height:calc(var(--n) * var(--slot)); }
  .slot{ flex:1; display:flex; align-items:center; position:relative; min-height:0; }
  .slot > .in{ position:absolute; left:calc(var(--gap) / -2); width:calc(var(--gap) / 2); top:50%; border-top:1.5px solid var(--line); }
  .slot > .out{ position:absolute; left:var(--cw); width:calc(var(--gap) / 2); top:50%; border-top:1.5px solid var(--line); }
  .slot > .vl{ position:absolute; left:calc(var(--cw) + var(--gap) / 2 - .75px); border-left:1.5px solid var(--line); }
  .slot.even > .vl{ top:50%; height:50%; }
  .slot.odd > .vl{ top:0; height:calc(50% + 1px); }
  .slot > .hot{ border-color:var(--accent); border-width:2.5px; z-index:1; }
  .slot > .vl.hot{ border-left-width:2.5px; }

  .m{ width:var(--cw); background:var(--surface); border:1px solid var(--line); border-radius:12px; overflow:hidden; position:relative; z-index:2; }
  .m.path{ border-color:var(--accent); }
  .m.next{ border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  .mh{ display:flex; justify-content:space-between; gap:8px; padding:6px 10px 5px; font:500 10.5px/1.2 "Chivo Mono", monospace; color:var(--dim); background:var(--surface-2); letter-spacing:.02em; }
  .mh .st{ text-transform:uppercase; letter-spacing:.06em; white-space:nowrap; }
  .mh .st.nr{ color:var(--loss); }
  .mh .st.nx{ color:var(--accent); font-weight:600; }
  .e{ display:grid; grid-template-columns:auto 1fr auto; gap:8px; align-items:center; padding:6px 10px; min-height:40px; --ring:var(--surface); }
  .e + .e{ border-top:1px solid var(--line); }
  .e .n{ font:600 12.5px/1.2 "Instrument Sans", sans-serif; min-width:0; overflow-wrap:anywhere; }
  .e .n .sd{ font:500 10px/1 "Chivo Mono", monospace; color:var(--dim); padding:2px 4px; border:1px solid var(--line); border-radius:4px; margin-left:4px; white-space:nowrap; vertical-align:1px; }
  .e.lost .n{ color:var(--faint); font-weight:500; }
  .e.ph .n{ color:var(--faint); font-weight:500; font-size:11.5px; }
  .e.me{ background:var(--accent-soft); box-shadow:inset 3px 0 0 var(--accent); --ring:var(--accent-soft); }
  .e .sc{ display:flex; gap:3px; }
  .e .sc span{ width:17px; text-align:center; font:500 13px/1 "Chivo Mono", monospace; font-variant-numeric:tabular-nums; color:var(--faint); }
  .e.won .sc span{ color:var(--ink); font-weight:600; }
  .e .wmark{ font:600 10px/1 "Chivo Mono", monospace; letter-spacing:.06em; color:var(--accent); }
  .av.ph{ background:var(--surface-2); color:var(--faint); box-shadow:0 0 0 2px var(--ring, var(--surface)); }
  .bk-note{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; font:500 11px/1.4 "Chivo Mono", monospace; color:var(--dim); margin-top:4px; }
  .bk-note i{ display:inline-block; width:14px; height:0; border-top:2.5px solid var(--accent); vertical-align:3px; margin-right:6px; }

  table.gt{ width:100%; border-collapse:collapse; font-size:13px; }
  .tbl{ margin-top:14px; padding:12px 14px 6px; }
  .tblhd{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:4px; }
  .tblhd b{ font:900 20px/1 "Big Shoulders Display", sans-serif; text-transform:uppercase; letter-spacing:.02em; }
  .tblhd span{ font:500 11px/1.3 "Chivo Mono", monospace; color:var(--dim); text-align:right; }
  .tbl .gt td:first-child{ max-width:0; width:52%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tbl .gt th, .tbl .gt td{ padding-left:3px; padding-right:3px; }
  .tbl .gt tr.me td{ background:var(--accent-soft); font-weight:700; }
  .tbl .gt tr.me td:first-child{ box-shadow:inset 3px 0 0 var(--accent); }
  .tpos{ display:inline-block; width:18px; color:var(--dim); font:500 11px/1 "Chivo Mono", monospace; }
  .gt th{ font:500 10.5px/1 "Chivo Mono", monospace; color:var(--dim); text-align:right; padding:6px 4px; }
  .gt th:first-child, .gt td:first-child{ text-align:left; }
  .gt td{ padding:8px 4px; border-top:1px solid var(--line); text-align:right; font-family:"Chivo Mono", monospace; }
  .gt td:first-child{ font-family:"Instrument Sans", sans-serif; font-weight:600; }
  .gt tr.me td{ background:var(--accent-soft); }

  /* ---------- stats ---------- */
  .stats{ display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
  .stat{ padding:12px 0 12px 12px; min-width:0; }
  .stat:first-child{ padding-left:0; }
  .stat + .stat{ border-left:1px solid var(--line); }
  .stat .k{ font:500 10.5px/1.2 "Chivo Mono", monospace; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); }
  .stat .v{ font:900 clamp(34px, 11vw, 44px)/1 "Big Shoulders Display", sans-serif; font-variant-numeric:tabular-nums; margin-top:6px; }
  .stat .s{ font-size:12px; color:var(--dim); margin-top:3px; }
  .chart{ margin-top:14px; padding:14px 12px 12px; }
  .chart svg{ display:block; width:100%; height:auto; overflow:visible; }
  .chart .cap{ font-size:12.5px; color:var(--dim); margin:6px 4px 0; }
  .record{ display:grid; grid-template-columns:1fr 1fr; margin-top:14px; }
  .record div{ padding:0 12px; }
  .record div:first-child{ padding-left:0; }
  .record div + div{ border-left:1px solid var(--line); }
  .record .k{ font:500 10.5px/1.2 "Chivo Mono", monospace; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); }
  .record b{ display:block; font:900 30px/1 "Big Shoulders Display", sans-serif; margin-top:5px; font-variant-numeric:tabular-nums; }
  .record span{ font-size:12px; color:var(--dim); }
  .formrow{ margin-top:16px; }
  .formrow .k{ display:flex; justify-content:space-between; font:500 10.5px/1.2 "Chivo Mono", monospace; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); margin-bottom:6px; }
  .form{ display:grid; grid-template-columns:repeat(10, minmax(0, 1fr)); gap:4px; max-width:340px; }
  .chip{ aspect-ratio:1; border-radius:7px; display:flex; align-items:center; justify-content:center; font:800 15px/1 "Big Shoulders Display", sans-serif; }
  .chip.w{ background:var(--solid); color:var(--solid-ink); }
  .chip.l{ background:transparent; color:var(--faint); box-shadow:inset 0 0 0 1.5px var(--line); }
  .kskill{ display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px; margin-top:14px; }
  .kskill > div{ display:flex; flex-direction:column; justify-content:space-between; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:10px 12px; }
  .kskill .k{ font:500 10.5px/1.2 "Chivo Mono", monospace; letter-spacing:.06em; text-transform:uppercase; color:var(--dim); }
  .kskill b{ display:block; font:900 28px/1 "Big Shoulders Display", sans-serif; margin-top:6px; font-variant-numeric:tabular-nums; }
  .kskill .now{ background:var(--panel); border-color:var(--panel); color:var(--board-ink); }
  .kskill .now .k{ color:var(--racket); }

  /* ---------- history ---------- */
  .hist{ padding:2px 16px; }
  .hrow{ display:grid; grid-template-columns:1fr auto; gap:10px; align-items:center; padding:9px 0 9px 12px; position:relative; }
  .hrow + .hrow{ border-top:1px solid var(--line); }
  .hrow::before{ content:""; position:absolute; left:0; top:9px; bottom:9px; width:3px; border-radius:2px; background:var(--accent); }
  .hrow.l::before{ background:var(--loss); opacity:.7; }
  .hrow .o{ font-weight:700; font-size:14px; line-height:1.25; overflow-wrap:anywhere; }
  .hrow .ev{ font-size:12px; color:var(--dim); line-height:1.3; margin-top:1px; }
  .hrow .r{ text-align:right; font:500 11.5px/1.35 "Chivo Mono", monospace; color:var(--dim); white-space:nowrap; }
  .hrow .r b{ display:block; font-weight:600; color:var(--ink); }
  .hrow.l .r b{ color:var(--loss); }
  .hrow.new .o::after{ content:"Idag"; margin-left:8px; font:600 10px/1 "Chivo Mono", monospace; letter-spacing:.06em; text-transform:uppercase; color:var(--accent); vertical-align:2px; }

  /* ---------- recent tournaments ---------- */
  .tsum{ display:flex; align-items:baseline; flex-wrap:wrap; gap:4px 10px; margin:0 0 12px; font-size:13.5px; line-height:1.35; color:var(--dim); }
  .tsum b{ font:900 30px/1 "Big Shoulders Display", sans-serif; text-transform:uppercase; letter-spacing:.01em; color:var(--ink); }
  .tours{ padding:2px 14px; }
  .tr{ display:grid; grid-template-columns:76px minmax(0,1fr) auto; gap:12px; align-items:center; padding:11px 0; }
  .tr + .tr{ border-top:1px solid var(--line); }
  .pb{
    display:flex; align-items:center; justify-content:center; height:30px; padding:0 4px; border-radius:8px; white-space:nowrap;
    font:800 14.5px/1 "Big Shoulders Display", sans-serif; letter-spacing:.05em; text-transform:uppercase;
    background:var(--surface-2); color:var(--ink);
  }
  .pb.win{ background:var(--ball); color:#0A1733; }
  .pb.hi{ background:var(--panel); color:var(--racket); }
  .pb.long{ font-size:12.5px; letter-spacing:.02em; }
  .pb.now{ background:var(--accent-soft); color:var(--accent); box-shadow:inset 0 0 0 1.5px var(--accent); gap:6px; }
  .pb.now i{ width:6px; height:6px; border-radius:50%; background:currentColor; flex:none; }
  .tr .dt{ display:block; text-align:center; margin-top:5px; font:500 10.5px/1 "Chivo Mono", monospace; letter-spacing:.04em; text-transform:uppercase; color:var(--dim); }
  .tr .tn{ font-weight:700; font-size:14px; line-height:1.25; color:var(--ink); text-decoration:none; overflow-wrap:anywhere; }
  .tr .tn:hover{ text-decoration:underline; }
  .tr .tn span{ font:500 11px/1 "Chivo Mono", monospace; color:var(--faint); margin-left:3px; }
  .tr .tm{ font-size:12px; line-height:1.35; color:var(--dim); margin-top:2px; }
  .tr .wl{ text-align:right; }
  .tr .wl b{ display:block; font:900 22px/1 "Big Shoulders Display", sans-serif; font-variant-numeric:tabular-nums; }
  .tr .wl span{ display:block; margin-top:4px; font:500 10.5px/1.2 "Chivo Mono", monospace; color:var(--dim); white-space:nowrap; }

  /* ---------- upcoming ---------- */
  .ups{ display:grid; gap:10px; }
  .up{ display:grid; grid-template-columns:62px 1fr; gap:14px; }
  .date{ border-radius:12px; background:var(--panel); color:var(--board-ink); text-align:center; padding:9px 4px 8px; align-self:start; }
  .date small{ display:block; font:600 10.5px/1 "Chivo Mono", monospace; letter-spacing:.1em; text-transform:uppercase; color:var(--racket); }
  .date b{ display:block; font:900 30px/1 "Big Shoulders Display", sans-serif; margin-top:4px; }
  .date span{ display:block; font:500 10.5px/1 "Chivo Mono", monospace; color:var(--board-dim); margin-top:3px; text-transform:uppercase; letter-spacing:.08em; }
  .up h3{ margin:0; font:800 21px/1.05 "Big Shoulders Display", sans-serif; text-transform:uppercase; letter-spacing:.02em; overflow-wrap:anywhere; }
  .up h3 .cls{ display:inline-block; font:600 11px/1 "Chivo Mono", monospace; letter-spacing:.06em; padding:4px 6px; border-radius:5px; background:var(--accent); color:var(--surface); vertical-align:3px; margin-left:4px; }
  .up .what{ font-size:13px; color:var(--dim); margin-top:4px; line-height:1.4; }
  .up ul{ list-style:none; margin:8px 0 0; padding:0; font-size:13.5px; }
  .up li{ padding:6px 0; border-top:1px solid var(--line); overflow-wrap:anywhere; }
  .up li:last-child{ padding-bottom:0; }
  .up .facts{ font-size:12.5px; line-height:1.5; color:var(--dim); margin-top:8px; }
  .up .facts a{ font-family:"Instrument Sans", sans-serif; font-weight:600; font-size:13px; }

  /* ---------- info ---------- */
  .info{ border-top:1px solid var(--line); }
  .info details{ border-bottom:1px solid var(--line); }
  .info summary{ list-style:none; cursor:pointer; display:flex; justify-content:space-between; align-items:center; gap:12px; padding:14px 0; font:800 20px/1.1 "Big Shoulders Display", sans-serif; text-transform:uppercase; letter-spacing:.03em; }
  .info summary::-webkit-details-marker{ display:none; }
  .info summary .pl{ width:22px; height:22px; flex:none; position:relative; border-radius:50%; background:var(--surface-2); }
  .info summary .pl::before, .info summary .pl::after{ content:""; position:absolute; left:6px; right:6px; top:10px; height:2px; background:var(--ink); border-radius:1px; }
  .info summary .pl::after{ transform:rotate(90deg); }
  .info details[open] summary .pl::after{ transform:rotate(0deg); }
  .info .body{ padding:0 0 16px; font-size:14px; line-height:1.55; }
  .info .body p{ margin:0 0 8px; }
  .info .body p.me{ padding:10px 12px; border-radius:10px; background:var(--accent-soft); }
  .info .src{ font:500 11.5px/1.6 "Chivo Mono", monospace; color:var(--dim); margin-top:6px; }
  .info .src a{ margin-right:10px; }

  /* ---------- small hero parts ---------- */
  .khero{ margin:4px -16px 0; background:var(--board); color:var(--board-ink); padding:16px 16px 0; position:relative; overflow:hidden; }
  .khero .court{ position:absolute; right:-40px; top:0; width:260px; height:62%; opacity:.1; }
  .kgrid{ position:relative; display:grid; grid-template-columns:118px 1fr; gap:16px; align-items:end; }
  .kphoto{ width:118px; aspect-ratio:118/170; border-radius:14px; overflow:hidden; background:#13245A; }
  .kphoto img{ width:100%; height:100%; object-fit:cover; object-position:50% 50%; }
  .kname{ font:900 58px/.82 "Big Shoulders Display", sans-serif; text-transform:uppercase; letter-spacing:.01em; }
  .kname small{ display:block; font:800 24px/1 "Big Shoulders Display", sans-serif; color:var(--board-dim); margin-top:6px; letter-spacing:.03em; }
  .kmeta{ font:500 11.5px/1.4 "Chivo Mono", monospace; color:var(--racket); margin-top:10px; letter-spacing:.04em; }
  .kbig{ position:relative; display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin-top:18px; }
  .kbig .bigtime{ font-size:clamp(88px, 28vw, 120px); }
  .kbig .lab{ text-align:right; padding-bottom:4px; }
  .kbig .lab b{ display:block; font:900 26px/1 "Big Shoulders Display", sans-serif; text-transform:uppercase; }
  .kbig .lab span{ font:500 11.5px/1.3 "Chivo Mono", monospace; color:var(--board-dim); }
  .knote{ position:relative; font-size:15px; line-height:1.4; margin:14px 0 0; padding:12px 0 14px; border-top:1px solid var(--board-line); }
  .khero2 > img{ object-position:50% 0%; }
  .hero{ touch-action:pan-y; }
  .court-no b.spf{ font-size:clamp(28px, 8vw, 40px); }
  .khero2 .bigtime{ font-size:clamp(84px, 26vw, 136px); }
  .khero2 .timeline-big{ gap:10px; }
  .kid{ padding:14px 0 2px; }
  .kid .kname{ font:900 30px/1 "Big Shoulders Display", sans-serif; text-transform:uppercase; letter-spacing:.01em; }
  .kid .kname span{ color:var(--board-dim); }
  .kid .kmeta{ margin-top:6px; }
  .results{ display:grid; gap:10px; }
  .res{ background:var(--surface); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  .res .mh{ padding:8px 12px 7px; }
  .res .e{ padding:9px 12px; }
  .res .e .n{ font-size:14px; }
  .res .e .sc span{ width:22px; font-size:15px; }
  .winners{ font-size:13.5px; color:var(--dim); margin:12px 0 0; }
  .winners b{ color:var(--ink); }

  /* ---------- live ---------- */
  .livebar{ display:flex; align-items:center; gap:8px; margin:2px 0 8px; min-width:0; font:500 11px/1.3 "Chivo Mono", monospace; letter-spacing:.06em; text-transform:uppercase; color:var(--dim); }
  .livebar[hidden]{ display:none; }
  .livebar .ldot{ width:8px; height:8px; border-radius:50%; background:var(--accent); flex:none; }
  .livebar b{ color:var(--ink); font-weight:600; }
  .livebar.stale{ text-transform:none; letter-spacing:.02em; }
  .livebar.stale .ldot{ background:var(--faint); }
  .livebar.wait .ldot{ background:var(--faint); }
  .lastres{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:10px 0; border-bottom:1px solid var(--board-line); font:500 12px/1.35 "Chivo Mono", monospace; color:var(--board-dim); }
  .lastres[hidden]{ display:none; }
  .lastres b{ color:var(--board-ink); font-weight:600; }
  .lastres .sc{ color:var(--board-ink); white-space:nowrap; }
  .team .tag b{ display:block; color:var(--board-ink); font-size:13px; letter-spacing:.02em; margin-top:3px; white-space:nowrap; }
  .e .sc span.x{ width:auto; padding:0 1px; }
  .route li.lost .node{ border-color:var(--loss); background:var(--loss-soft); }
  .route li.out{ opacity:.5; }

  /* ---------- discovered events (any tournament / team league) ---------- */
  .dyn[hidden], [data-ev][hidden], .seg[hidden], .bk-note[hidden]{ display:none; }
  .grp + .grp{ margin-top:12px; }
  .grp h3{ margin:0 0 4px; font:800 19px/1 "Big Shoulders Display", sans-serif; text-transform:uppercase; letter-spacing:.04em; }
  .gt .gsk{ display:block; font:500 10.5px/1.3 "Chivo Mono", monospace; color:var(--dim); font-weight:500; }
  .gm{ display:grid; gap:8px; margin-top:12px; }
  .gm .res{ border-radius:12px; }
  .res.mine{ border-color:var(--accent); }
  .tie + .tie{ margin-top:26px; }
  .tiehd{ display:grid; grid-template-columns:minmax(0,1fr) auto; gap:12px; align-items:center; margin-bottom:10px; }
  .tiehd .tt{ font:800 20px/1.05 "Big Shoulders Display", sans-serif; text-transform:uppercase; letter-spacing:.02em; overflow-wrap:anywhere; }
  .tiehd .tt i{ font-style:normal; color:var(--faint); }
  .tiehd .tm{ font:500 11.5px/1.4 "Chivo Mono", monospace; color:var(--dim); margin-top:4px; }
  .tiehd .ts{ font:900 36px/1 "Big Shoulders Display", sans-serif; font-variant-numeric:tabular-nums; text-align:right; }
  .tiehd .ts small{ display:block; font:500 10.5px/1.2 "Chivo Mono", monospace; letter-spacing:.06em; text-transform:uppercase; color:var(--dim); margin-top:3px; }
  .empty{ font-size:13.5px; line-height:1.45; color:var(--dim); margin:0; }
  .court-no[hidden]{ display:none; }


  /* ---------- pair average skill ---------- */
  .e .n .sk b, .gt .gsk b{ font-weight:600; color:var(--ink); margin-right:2px; }
  .opt .osk b{ font-weight:600; color:var(--board-ink); margin-right:2px; }
  .cmp{ padding:11px 0 12px; border-top:1px dashed var(--board-line); }
  .cmp-row{ display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); gap:10px; align-items:end; }
  .cmp-side small{ display:block; font:500 11px/1.3 "Chivo Mono", monospace; color:var(--board-dim); overflow-wrap:anywhere; }
  .cmp-side b{ display:block; font:900 30px/1 "Big Shoulders Display", sans-serif; font-variant-numeric:tabular-nums; margin-top:4px; color:var(--board-ink); }
  .cmp-side.me b{ color:var(--racket); }
  .cmp-side.op{ text-align:right; }
  .cmp-row > i{ font:500 13px/1 "Chivo Mono", monospace; font-style:normal; color:var(--board-dim); padding-bottom:7px; }
  .cmp-bar{ position:relative; height:6px; border-radius:3px; background:rgba(255,255,255,.1); margin-top:10px; }
  .cmp-bar::after{ content:""; position:absolute; left:calc(50% - .75px); top:-3px; bottom:-3px; width:1.5px; background:var(--board-dim); }
  .cmp-bar span{ position:absolute; top:0; bottom:0; }
  .cmp-bar .me{ right:50%; background:var(--racket); border-radius:3px 0 0 3px; }
  .cmp-bar .op{ left:50%; background:var(--board-dim); border-radius:0 3px 3px 0; }
  .cmp-note{ font:500 11px/1.3 "Chivo Mono", monospace; color:var(--board-dim); margin-top:7px; }

  /* ---------- trend arrows (Utveckling) ---------- */
  .stat .d, .kskill .d{ font:600 11.5px/1.2 "Chivo Mono", monospace; margin-top:4px; white-space:nowrap; letter-spacing:.01em; }
  .stat .d[hidden], .kskill .d[hidden]{ display:none; }
  .d .up{ color:var(--up); }
  .d .down{ color:var(--loss); }
  .kskill .now .d .up{ color:#6FD69C; }
  .kskill .now .d .down{ color:#F0A89F; }

  /* ---------- senaste resultat (strip under the live bar) ---------- */
  .recent{ margin:0 -16px 10px; }
  .recent[hidden]{ display:none; }
  .recent .rk{ font:500 10.5px/1.2 "Chivo Mono", monospace; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); padding:0 16px 6px; }
  .recent ol{ list-style:none; margin:0; padding:0 16px 2px; display:flex; gap:8px; overflow-x:auto; scroll-snap-type:x proximity; scroll-padding-inline:16px; scrollbar-width:none; overscroll-behavior-x:contain; }
  .recent ol::-webkit-scrollbar{ display:none; }
  .recent li{ flex:0 0 auto; width:min(62vw, 214px); scroll-snap-align:start; display:flex; }
  .recent a{ display:block; width:100%; padding:8px 10px 9px; border-radius:12px; background:var(--surface); border:1px solid var(--line); color:var(--ink); text-decoration:none; }
  .recent a.mine{ border-color:var(--accent); box-shadow:inset 3px 0 0 var(--accent); background:var(--accent-soft); }
  .recent .rh{ display:flex; justify-content:space-between; gap:6px; font:500 10.5px/1.2 "Chivo Mono", monospace; color:var(--dim); white-space:nowrap; }
  .recent .rh b{ font-weight:600; color:var(--accent); text-transform:uppercase; letter-spacing:.06em; }
  .recent .rw{ font:700 13px/1.25 "Instrument Sans", sans-serif; margin-top:5px; overflow-wrap:anywhere; }
  .recent .rl{ font:500 11.5px/1.35 "Chivo Mono", monospace; color:var(--dim); margin-top:2px; overflow-wrap:anywhere; }

  /* ---------- deep link highlight ---------- */
  .flash{ outline:3px solid var(--accent); outline-offset:2px; }

  /* ---------- between events: result + next event ---------- */
  .bigtime.word{ font-size:clamp(50px, 15.5vw, 86px); line-height:.86; text-transform:uppercase; overflow-wrap:anywhere; padding-top:.16em; }
  .timeline-big.wrap{ flex-wrap:wrap; row-gap:8px; }
  .nextev{ padding:12px 0 4px; border-top:1px solid var(--board-line); }
  .nextev[hidden]{ display:none; }
  .nextev .nk{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; font:600 11px/1.2 "Chivo Mono", monospace; letter-spacing:.12em; text-transform:uppercase; color:var(--racket); }
  .nextev .nk span{ color:var(--board-ink); letter-spacing:.04em; white-space:nowrap; }
  .nextev h3{ margin:7px 0 0; font:800 22px/1.05 "Big Shoulders Display", sans-serif; text-transform:uppercase; letter-spacing:.02em; color:var(--board-ink); overflow-wrap:anywhere; }
  .nextev .nf{ font:500 12px/1.5 "Chivo Mono", monospace; color:var(--board-dim); margin-top:5px; overflow-wrap:anywhere; }
  .nextev .nf b{ color:var(--board-ink); font-weight:600; }
  .nextev .nd{ font-size:14px; line-height:1.4; color:var(--board-ink); margin:10px 0 4px; }
  .nextev .nd b{ color:var(--racket); }

  /* ---------- senaste tävlingar: expandable rows ---------- */
  .tr-item + .tr-item{ border-top:1px solid var(--line); }
  button.tr{ appearance:none; border:0; background:none; width:100%; margin:0; text-align:left; color:inherit; font:inherit; cursor:pointer; border-radius:10px; }
  .tr .tn{ display:block; }
  .tr .wl .chev{ display:inline-block; width:8px; height:8px; margin:6px 2px 0 0; border-right:2px solid var(--faint); border-bottom:2px solid var(--faint); transform:rotate(45deg); transition:transform .2s; }
  .tr[aria-expanded="true"] .wl .chev{ transform:rotate(225deg); margin-top:10px; }
  .tx{ padding:0 0 16px; }
  .tx[hidden]{ display:none; }
  .tx-top{ display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:4px 12px; font:500 12px/1.4 "Chivo Mono", monospace; color:var(--dim); margin-bottom:10px; }
  .tx-top b{ color:var(--ink); font-weight:600; }
  .tx-top a{ font-family:"Instrument Sans", sans-serif; font-weight:600; font-size:13px; }
  .tx h4{ margin:16px 0 8px; font:800 17px/1 "Big Shoulders Display", sans-serif; text-transform:uppercase; letter-spacing:.05em; }
  .tx .results{ gap:8px; }
  .tx .bk-wrap{ margin:0 -14px; }
  .tx .bk-scroll{ padding:0 14px 10px; scroll-padding-inline:14px; }
  .tx-note{ font-size:13px; line-height:1.45; color:var(--dim); margin:2px 0 6px; }
  .tx-note button{ appearance:none; border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:8px; padding:5px 10px; margin-left:6px; font:600 12.5px/1 "Instrument Sans", sans-serif; cursor:pointer; }

  @media (min-width:640px){
    .recent{ margin-left:0; margin-right:0; }

  }

  footer{ margin-top:48px; padding-top:18px; border-top:2px solid var(--ink); display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap; }
  footer b{ font:900 22px/1 "Big Shoulders Display", sans-serif; letter-spacing:.12em; text-transform:uppercase; }
  footer span{ font:500 11px/1.4 "Chivo Mono", monospace; color:var(--dim); }

  @media (min-width:640px){

    } else if (x.view === "team"){
      var T = TEAMS.filter(function(t){ return t.id === x.teamId; })[0];
      if (!T){ location.replace("#/"); return; }
      renderTeam(T); showView("team");
      VIEW = {name:"team", who:null, team:T.id};
      document.title = T.name + " · Nynäs Padel";
    } else {
      renderHome(); showView("home");
      VIEW = {name:"home", who:null};
      document.title = "Nynäs Padel";
    }
    if (nav) nav.hidden = VIEW.name === "home";
    renderChips(VIEW.who);
    // Live views of players no longer shown stop, unless they are needed for notiser
    Object.keys(DYN).forEach(function(k){ if (DYN[k] && k !== VIEW.who && !watchWanted(BYKEY[k])) stopDyn(k); });
    var now2 = VIEW.name + ":" + (VIEW.who || VIEW.team || "");
    if (x.mid) focusMatch(x.who, x.mid, 0);
    else if (now2 !== prev) try { window.scrollTo(0, 0); } catch (e){}
    window.dispatchEvent(new Event("resize"));
  }
  // Player to player (chips, swipe): replace, so Back goes to "Nynäs idag" and not through every player.
  function goPlayer(key){
    var h = "#" + key;
    if (location.hash === h) return;
    if (VIEW.name === "player") { history.replaceState(null, "", h); handleHash(); }
    else location.hash = h;
  }
  // Swipe order: the followed players (when the open one is followed), otherwise the open player's team.
  function swipeOrder(key){
    var f = followedPlayers().map(function(p){ return p.key; }), P = BYKEY[key];
    if (f.length > 1 && f.indexOf(key) >= 0) return f;
    return P ? ROSTER.filter(function(p){ return p.teamId === P.teamId; }).map(function(p){ return p.key; }) : [];
  }

  /* ================= swipe the photo to switch player ================= */
  // Horizontal swipe on the hero: left -> next player, right -> previous. The photo follows the finger a
  // little (rubber band at the ends), vertical scrolling stays native (touch-action: pan-y).
  (function(){
    var sx = 0, sy = 0, el = null, dx = 0, lock = null;
    var calm = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    function step(dir){ var o = swipeOrder(VIEW.who), i = o.indexOf(VIEW.who), j = i + dir; return i >= 0 && j >= 0 && j < o.length ? o[j] : null; }
    document.addEventListener("touchstart", function(e){
      var h = e.target.closest && e.target.closest("main.view:not([hidden]) .hero");
      if (!h || VIEW.name !== "player" || e.touches.length !== 1 || e.target.closest("a, button")){ el = null; return; }
      el = h; sx = e.touches[0].clientX; sy = e.touches[0].clientY; dx = 0; lock = null;
      el.style.transition = "none";
    }, {passive:true});
    document.addEventListener("touchmove", function(e){
      if (!el) return;
      var x = e.touches[0].clientX - sx, y = e.touches[0].clientY - sy;
      if (lock === null && (Math.abs(x) > 8 || Math.abs(y) > 8)) lock = Math.abs(x) > Math.abs(y) * 1.2 ? "x" : "y";
      if (lock !== "x") return;
      dx = x;
      var pull = step(x < 0 ? 1 : -1) ? x * 0.45 : x * 0.18;
      if (!calm) el.style.transform = "translateX(" + pull.toFixed(1) + "px)";
    }, {passive:true});
    function end(){
      if (!el) return;
      var h = el, dir = dx < 0 ? 1 : -1, to = lock === "x" && Math.abs(dx) > 60 ? step(dir) : null;
      el = null;
      h.style.transition = calm ? "" : "transform .32s cubic-bezier(.2,.8,.2,1)";
      h.style.transform = "";
      if (!to) return;
      goPlayer(to);
      var nh = document.querySelector("#p-" + to + " .hero");
      if (nh && !calm && nh.animate) nh.animate([{transform:"translateX(" + (dir * 40) + "px)", opacity:.4}, {transform:"none", opacity:1}], {duration:320, easing:"cubic-bezier(.2,.8,.2,1)"});
    }
    document.addEventListener("touchend", end, {passive:true});
    document.addEventListener("touchcancel", end, {passive:true});
  })();

  document.addEventListener("click", function(e){
    var a = e.target && e.target.closest && e.target.closest("a[href^='#']");
    if (a && a.classList.contains("pchip") && !e.metaKey && !e.ctrlKey){ e.preventDefault(); goPlayer(a.getAttribute("href").slice(1)); return; }
    // Tapping the same "Senaste resultat" card twice: no hashchange, so focus again by hand.
    if (a && a.closest(".recent") && a.getAttribute("href") === location.hash){ e.preventDefault(); handleHash(); return; }
    var fb = e.target && e.target.closest && e.target.closest("[data-follow]");
    if (fb){
      var pid = Number(fb.getAttribute("data-follow")), on = !isFollowed(pid), P = BYPID[pid];
      setFollowed(pid, on);
      hint(on ? "Du följer " + P.short + ". " + (notiOn() ? "Notiser för " + gen(P.short) + " matcher." : "Slå på Notiser för att få " + gen(P.short) + " resultat.") : "Du följer inte längre " + P.short + ".");
    }
  });
  window.addEventListener("hashchange", handleHash);
  // A tapped notis while the app is open: the service worker posts the link instead of reloading the page.
  try {
    if ("serviceWorker" in navigator) navigator.serviceWorker.addEventListener("message", function(e){
      var d = e.data || {};
      if (d.type !== "padel-open" || typeof d.hash !== "string") return;
      if (location.hash !== d.hash) history.replaceState(null, "", d.hash);
      handleHash();
    });
  } catch (e){}

  /* ================= app: notis-knapp, installera, service worker ================= */
  var bell = document.getElementById("bell"), hintEl = document.getElementById("nHint"), hintT = null;
  function hint(msg){
    if (!hintEl) return;
    hintEl.textContent = msg; hintEl.hidden = false;
    clearTimeout(hintT); hintT = setTimeout(function(){ hintEl.hidden = true; }, 9000);
  }
  if (hintEl) hintEl.addEventListener("click", function(){ hintEl.hidden = true; });
  function bellState(){ if (bell) bell.setAttribute("aria-pressed", notiOn() ? "true" : "false"); }
  function whoText(){ var n = followedPlayers().map(function(p){ return p.short; }); return n.length > 1 ? n.slice(0, -1).join(", ") + " och " + n[n.length - 1] : n[0] || ""; }
  function askPermission(){
    return new Promise(function(res){
      try {
        var r = Notification.requestPermission(function(x){ res(x); });
        if (r && r.then) r.then(res, function(){ res("default"); });
      } catch (e){ res("default"); }
    });
  }
  if (bell){
    bellState();
    bell.addEventListener("click", function(){
      if (IOS && !standalone()){ hint("På iPhone kommer notiser bara när sidan ligger på hemskärmen. Tryck Dela → Lägg till på hemskärmen och öppna den därifrån."); return; }
      if (!notiSupported()){ hint("Den här webbläsaren kan inte visa notiser."); return; }
      if (notiOn()){ store.set(NOTI_KEY, "0"); disablePush(); bellState(); hint("Notiser av."); return; }
      if (Notification.permission === "denied"){ hint("Notiser är blockerade för sidan. Tillåt dem i webbläsarens inställningar."); return; }
      if (!follows().length){ hint("Följ en spelare först. Tryck Följ på spelarens sida."); return; }
      askPermission().then(function(p){
        if (p === "granted"){
          store.set(NOTI_KEY, "1");
          var local = "Notiser på för " + whoText() + ". Funkar medan appen är öppen.";
          if (pushSupported()){
            hint("Slår på notiser …");
            enablePush().then(function(ok){
              hint(ok ? "Notiser på för " + whoText() + ", även när appen är stängd." : local);
              ensureWatch();
            });
          } else hint(local);
          ensureWatch();
        } else hint("Inga notiser. Du kan slå på dem senare.");
        bellState();
      });
    });
  }

  (function(){
    var bar = document.getElementById("appbar");
    if (!bar) return;
    var go = bar.querySelector(".go"), txt = bar.querySelector(".t span"), deferred = null;
    function show(mode){
      if (standalone() || store.get("padel.installHidden") === "1") return;
      go.hidden = mode !== "prompt";
      txt.textContent = mode === "ios" ? "Dela → Lägg till på hemskärmen" : "Nynäs Padel ett tryck bort.";
      bar.hidden = false;
    }
    window.addEventListener("beforeinstallprompt", function(e){ e.preventDefault(); deferred = e; show("prompt"); });
    window.addEventListener("appinstalled", function(){ bar.hidden = true; deferred = null; });
    go.addEventListener("click", function(){
      var d = deferred; deferred = null; bar.hidden = true;
      if (!d) return;
      try {
        d.prompt();
        if (d.userChoice) d.userChoice.then(function(c){ if (c && c.outcome === "accepted") store.set("padel.installHidden", "1"); }, function(){});
      } catch (e){}
    });
    bar.querySelector(".x").addEventListener("click", function(){ bar.hidden = true; store.set("padel.installHidden", "1"); });
    if (IOS && !standalone() && /Safari/.test(UA) && !/FBAN|FBAV|Instagram/.test(UA)) show("ios");
  })();

  if ("serviceWorker" in navigator){
    try {
      window.addEventListener("load", function(){
        try { navigator.serviceWorker.register("sw.js").catch(function(){}); } catch (e){}
      });
    } catch (e){}
  }

  /* ================= start: roster first, then everything else ================= */
  function start(list){
    setRoster(list);
    var cm = document.getElementById("clubMeta");
    if (cm) cm.textContent = ROSTER.length + " spelare · " + TEAMS.length + " lag i SPL";
    var q = document.getElementById("q");
    if (q) q.addEventListener("input", renderPlayerList);
    try { var cachedDisc = store.json(EV_KEY); if (cachedDisc) applyDisc(cachedDisc); } catch (e){}
    handleHash();
    try { loadEvents(); } catch (e){}
    setInterval(function(){ try { loadEvents(); } catch (e){} }, 30 * 60000);
    // Re-pick the open player's event now and then (a window opens or closes) and keep the countdowns fresh.
    setInterval(function(){
      if (!DISC) return;
      if (VIEW.name === "home") try { renderNow(); } catch (e){}
      Object.keys(PANELS).forEach(function(w){ if (!PANELS[w].hidden || DYN[w]) try { setMode(w, pickHero(w)); } catch (err){} });
      ensureWatch();
    }, 30000);
    // Keep this device's push subscription in sync (renewed, the server was redeployed, follows changed).
    if (notiOn() && pushSupported()) enablePush();
    else if (store.get(PUSH_KEY) === "1" && !pushSupported()) store.set(PUSH_KEY, "0");
  }
  function failed(){
    var h = document.getElementById("nowList");
    if (h) h.innerHTML = '<p class="empty">Kunde inte ladda spelarna. Kontrollera nätet och ladda om sidan.</p>';
  }
  try {
    document.getElementById("today").textContent = cap(dayLabel(now()));
    fetch("players.json", {cache:"no-cache"}).then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function(list){ try { start(list); } catch (e){ warn("Start", e); failed(); } }, failed);
  } catch (e){ failed(); }
})();
</script>
</body>
